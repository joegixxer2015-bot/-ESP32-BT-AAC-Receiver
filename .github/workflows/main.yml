name: Check ESP32 BT Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Dependencies
        run: |
          # ติดตั้งไลบรารีผ่าน Git URL โดยตรงเพื่อความชัวร์
          arduino-cli lib install --git-url https://github.com/pschatzmann/ESP32-A2DP.git

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32dev ESP32_BT_AAC_Receiver
