name: Check ESP32 BT Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_0.35.3_Linux_64bit.tar.gz | tar -xz
          sudo mv arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set library.enable_unsafe_install true
      - name: Build check
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install --git-url https://github.com/pschatzmann/ESP32-A2DP.git
          SKETCH=$(find . -name "*.ino" | head -n 1)
          echo "Found sketch: $SKETCH"
          arduino-cli compile --fqbn esp32:esp32:esp32 "$SKETCH"
