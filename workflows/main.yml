name: Check ESP32 BT Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: arduino/setup-arduino-cli@v1
      - run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ESP32-A2DP"
          arduino-cli compile --fqbn esp32:esp32:esp32 ESP32_BT_AAC_Receiver.ino
